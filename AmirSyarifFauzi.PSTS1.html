<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmirSyarifFauzi ABBS BOYOLALI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

    <header class="bg-blue-500 text-white shadow-lg">
        <div class="max-w-6xl mx-auto px-6 py-8 text-center">
            <h1 class="text-3xl md:text-4xl font-bold">
                Student Creativity Festival
            </h1>
            <p class="mt-2 text-blue-100">
                Berani Berkarya Untuk Masa Depan
            </p>
        
    </header>

    <form>
    
        <div>
        <label for="name">Name:</label>
        <input type="text" placeholder="Your Name" class=" w-50 px-3 py-2 text-xs bg-violet-500 text-white rounded border border-violet-200 focus:border-indigo-500 placeholder-indigo-400" required/>
        </div>

        <div>
        <label for="class">Class:</label>
        <input type="text" placeholder="Your Class" class="w-50 px-3 py-2 text-xs bg-violet-500 text-white rounded border border-violet-200 focus:border-indigo-500 placeholder-indigo-400" required/>
        </div>

        <div>
        <label for="gender"id="gender" >Gender:</label>
        </div>
        <div>
        <label for="gender"id="gender" >Female</label>
        <input type="radio" id="female" name="Female"/>
        
        <label for="gender"id="gender" >Male:</label>
        <input type="radio" id="Male" name="Male"/>
        </div>
    </form>
    <div>
        <h3 class="text-xs font-bold tracking-wider text-black mb-2">Competition Category:</h3>
        <div>
            <span class="border px-3 rounded-full text-sm font-medium">Web Devolopment</span>
            <span class="border px-3 rounded-full text-sm font-medium">IoT Project</span>
            <span class="border px-3 rounded-full text-sm font-medium">Grapic Design</span>
            <span class="border px-3 rounded-full text-sm font-medium">Public Speaking</span>
            <span class="border px-3 rounded-full text-sm font-medium">Photography</span>
        </div>
        <form>
            <div>
            <label for="Participation Type">Participation Type</label>
            <input type="text" placeholder="Individual/Team" class="w-50 px-3 py-2 text-xs bg-violet-500 text-white rounded border border-violet-200 focus:border-indigo-500 placeholder-indigo-400" required/>
            </div>

            <div>

            <label for="team name">Team Name</label>
            <input type="text" placeholder="Enter your team's name" class="w-50 px-3 py-2 text-xs bg-violet-500 text-white rounded border border-violet-200 focus:border-indigo-500 placeholder-indigo-400" required/>
            </div>

            <div>
            <label for="Contact Number">Contact Number</label>
            <input type="text" placeholder="08xxxxxxxxxx" class=" w-50 px-3 py-2 text-xs bg-violet-500 text-white rounded border border-violet-200 focus:border-indigo-500 placeholder-indigo-400" required/>
            </div>

            <div>
            <label for="Project Descripition">Project Descripition</label>
            <input type="text" placeholder="Describe Your Project or Competition Entry.." class="w-50 px-3 py-2 text xs bg-violet-500 text-white rounded border border-violet-200 focus:border-indigo-500 placeholder-indigo-400" required/>
            </div>

            <button type="submit" class="w-full py-2 bg-emerald-500 hover:bg-emelard-400 text-white font-medium text-xs rounded transition-colors shadow">Register Now</button>

        </form>
        </div>

        <table>
            <thead class="bg-blue-600 text-white shadow-lg">
                <th class="p-4 text-lg text-blue mb-1 border-gray-800">No</th>
                <th class="p-4 text-lg text-blue mb-1 border-gray-800">Participant</th>
                <th class="p-4 text-lg text-blue mb-1 border-gray-800">Class</th>
                <th class="p-4 text-lg text-blue mb-1 border-gray-800">Category</th>
                <th class="p-4 text-lg text-blue mb-1 border-gray-800">Team</th>
                <th class="p-4 text-lg text-blue mb-1 border-gray-800">Status</th>
            </thead>
            <tbody>
                <td class="p-4 text-lg text-blue mb-1 border-gray-800">1</td>
                <td class="p-4 text-lg text-blue mb-1 border-gray-800">Amir Syarif Fauzi</td>
                <td class="p-4 text-lg text-blue mb-1 border-gray-800">X-1</td>
                <td class="p-4 text-lg text-blue mb-1 border-gray-800">Photography</td>
                <td class="p-4 text-lg text-blue mb-1 border-gray-800">EyProject</td>
                <td class="p-4 text-lg text-blue mb-1 border-gray-800">Registered</td>
            </tbody>
        
        </table>
    
</body>
</html>
